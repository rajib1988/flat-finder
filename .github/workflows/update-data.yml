name: Monthly data refresh

# Re-crawls every housing project in Kolkata and Delhi from Magicbricks, refetches buildings and nearby
# places from OpenStreetMap, rebuilds the site data, commits it and redeploys the site.
on:
  schedule:
    - cron: "30 20 1 * *"   # 02:00 IST on the 2nd of every month
  workflow_dispatch:
  push:                     # also runs when .github/refresh-request is edited (lets Claude ask for a refresh)
    branches: [main]
    paths: [".github/refresh-request"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl:
    strategy:
      fail-fast: false
      matrix:
        city: [kolkata, delhi]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Is this city requested?
        id: want
        # a push to .github/refresh-request may name cities on a line like "cities: delhi"; otherwise all run
        run: |
          req=$(grep -i '^cities:' .github/refresh-request 2>/dev/null | cut -d: -f2- || true)
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$req" ] || echo "$req" | grep -qw "${{ matrix.city }}"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "skipping ${{ matrix.city }}"; fi
          echo "month=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.want.outputs.run == 'true'
        with:
          python-version: "3.12"
      # pages downloaded this month are reused, so a rerun after a failure takes minutes, not hours
      - name: Restore this month's downloaded pages
        if: steps.want.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: pages-${{ matrix.city }}-${{ steps.want.outputs.month }}-${{ github.run_id }}
          restore-keys: pages-${{ matrix.city }}-${{ steps.want.outputs.month }}-
      - name: Magicbricks project list
        if: steps.want.outputs.run == 'true'
        working-directory: pipeline
        run: python3 mb_crawl.py list ${{ matrix.city }} 2>&1 | tee -a ../crawl-${{ matrix.city }}.log; exit ${PIPESTATUS[0]}
      - name: Magicbricks project pages (about 1 hour per 4,000 projects)
        if: steps.want.outputs.run == 'true'
        working-directory: pipeline
        run: python3 mb_crawl.py projects ${{ matrix.city }} 2>&1 | tee -a ../crawl-${{ matrix.city }}.log; exit ${PIPESTATUS[0]}
      - name: Save downloaded pages for reruns
        if: always() && steps.want.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: pipeline/cache
          key: pages-${{ matrix.city }}-${{ steps.want.outputs.month }}-${{ github.run_id }}
      - name: Build site data (without map extras)
        if: steps.want.outputs.run == 'true'
        working-directory: pipeline
        run: python3 build_city.py ${{ matrix.city }} 2>&1 | tee -a ../crawl-${{ matrix.city }}.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.run == 'true'
        with:
          name: data-${{ matrix.city }}
          path: web/public/data/${{ matrix.city }}*
          retention-days: 7
      # optional: nearby places, residential areas and building outlines from OpenStreetMap
      - name: OpenStreetMap nearby places, areas and buildings
        id: osm
        if: steps.want.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 60
        working-directory: pipeline
        run: python3 osm_fetch.py ${{ matrix.city }} 2>&1 | tee -a ../crawl-${{ matrix.city }}.log; exit ${PIPESTATUS[0]}
      - name: Rebuild with map extras
        if: always() && steps.want.outputs.run == 'true'
        working-directory: pipeline
        run: |
          ls out/${{ matrix.city }}/ | tee -a ../crawl-${{ matrix.city }}.log
          python3 build_city.py ${{ matrix.city }} 2>&1 | tee -a ../crawl-${{ matrix.city }}.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.run == 'true'
        with:
          name: data-${{ matrix.city }}
          path: web/public/data/${{ matrix.city }}*
          retention-days: 7
          overwrite: true
      - name: Save the log to the debug branch
        if: always() && steps.want.outputs.run == 'true'
        run: |
          git config user.name "flat-finder bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { grep -v "^  retry" crawl-${{ matrix.city }}.log 2>/dev/null || echo "no log"; } | tail -c 60000 > /tmp/log.txt
          git checkout -q --orphan dbg && git rm -rfq --cached . && cp /tmp/log.txt crawl-${{ matrix.city }}.log
          git add crawl-${{ matrix.city }}.log && git commit -qm "crawl log ${{ matrix.city }} run ${{ github.run_id }}" && git push -qf origin HEAD:debug-${{ matrix.city }}

  commit:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: new-data
          pattern: data-*
          merge-multiple: true
      - name: Commit refreshed data
        id: push
        run: |
          mkdir -p new-data
          # keep last month's files for a city if this run lost its map data (e.g. OpenStreetMap was down)
          python3 - <<'EOF'
          import json, pathlib, shutil
          new, cur = pathlib.Path("new-data"), pathlib.Path("web/public/data")
          for f in sorted(new.glob("*.json")):
              if "-" in f.stem:
                  continue
              c = f.stem
              osm = lambda p: sum(s.get("shape") == "osm" for s in json.loads(p.read_text())["societies"]) if p.exists() else 0
              pois = lambda p: len(json.loads(p.read_text())) if p.exists() else 0
              n_osm, o_osm = osm(f), osm(cur / f"{c}.json")
              n_poi, o_poi = pois(new / f"{c}-pois.json"), pois(cur / f"{c}-pois.json")
              if (o_osm and n_osm < 0.5 * o_osm) or (o_poi and n_poi < 0.5 * o_poi):
                  print(f"{c}: new build has less map data (osm {n_osm} vs {o_osm}, places {n_poi} vs {o_poi}); keeping the current files")
                  continue
              for g in new.glob(f"{c}*"):
                  shutil.copy(g, cur / g.name)
              print(f"{c}: updated")
          EOF
          python3 pipeline/write_cities.py
          git config user.name "flat-finder bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: commit
    if: needs.commit.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
